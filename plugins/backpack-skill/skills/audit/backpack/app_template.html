<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:">
<title>Tu mochila · Backpack Skill</title>
<style>
/*__FONTS__*/
:root {
  --bg: #EEF1EC; --surface: #FFFFFF; --ink: #16201A; --ink-2: #4C5A51;
  --line: #D5DDD6; --neutral: #DCE3DC; --orange: #F2581D; --mustard: #E9B425;
  --mustard-tint: #FBF0CF; --pine: #2E6B4E; --side-muted: #C9D3CC;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --text: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.4 var(--text); }
button, input { font: inherit; color: inherit; }
a { color: var(--ink); }
a:hover { color: var(--pine); }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); }
h1 { font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.6px; }
h2 { font-weight: 600; font-size: 19px; }
h3 { font-weight: 600; font-size: 16px; }
p { margin: 0; }
.mono { font-family: var(--mono); font-weight: 600; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 13px; }
.bold { font-weight: 700; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.5px; }
.wordmark span { color: var(--orange); }

/* layout: bottom nav on phones, dark side menu from 900px */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.side { display: none; }
main { flex: 1; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 16px; max-width: 1180px; width: 100%; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding: 8px 4px 14px; z-index: 5; }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; text-decoration: none; color: var(--ink-2); font-size: 12px; }
.bottom-nav a .pill { display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; }
.bottom-nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
.bottom-nav a[aria-current="page"] .pill { background: var(--orange); }
@media (min-width: 900px) {
  .shell { flex-direction: row; }
  .side { display: flex; flex-direction: column; gap: 28px; width: 240px; flex: none; background: var(--ink); color: #FFF; padding: 28px 18px; position: sticky; top: 0; height: 100vh; }
  .side nav { display: flex; flex-direction: column; gap: 6px; }
  .side nav a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: #FFF; text-decoration: none; font-size: 15px; }
  .side nav a[aria-current="page"] { background: var(--orange); color: var(--ink); font-weight: 700; }
  .side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; padding: 0 10px; font-size: 13px; color: var(--side-muted); }
  .bottom-nav, .topbar, .desk-hide { display: none; }
  main { width: auto; min-width: 0; padding: 36px 40px 48px; gap: 24px; }
  h1 { font-size: 40px; letter-spacing: -1px; }
}

/* parts */
.card { background: var(--surface); border-radius: 24px; padding: 22px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; background: var(--surface); border-radius: 18px; text-decoration: none; color: var(--ink); border: none; width: 100%; text-align: left; cursor: pointer; }
.dot { flex: none; width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.big { font-family: var(--display); font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -2px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.wrap { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 24px; border: 1.5px solid var(--ink); background: transparent; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--ink); color: #FFF; }
.btn.remove { background: var(--orange); border-color: var(--orange); color: var(--ink); }
.btn.keep { background: var(--pine); border-color: var(--pine); color: #FFF; }
.btn.wide { width: 100%; min-height: 56px; border-radius: 28px; font-size: 17px; }
.chip { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid var(--line); background: transparent; font-weight: 700; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFF; }
.tag { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: var(--neutral); }
.tag.orange { background: var(--orange); }
.tag.mustard { background: var(--mustard); }
.tag.green { background: var(--pine); color: #FFF; }
.tag.outline { background: transparent; border: 1.5px solid var(--ink); padding: 3px 10px; }
.note { padding: 14px; border-radius: 16px; background: var(--mustard-tint); }
.claude { padding: 14px; border-radius: 16px; border: 1.5px dashed var(--pine); }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1.5px solid currentColor; border-radius: 22px; background: transparent; font-weight: 700; font-size: 14px; cursor: pointer; }
.side .toggle { border: none; padding: 0; color: #FFF; }
.switch { width: 32px; height: 18px; border-radius: 9px; background: var(--line); display: flex; align-items: center; padding: 2px; }
.switch::after { content: ""; width: 14px; height: 14px; border-radius: 7px; background: #FFF; }
.toggle[aria-pressed="true"] .switch { background: var(--pine); justify-content: flex-end; }
dl.facts { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
dl.facts dt { font-size: 13px; color: var(--ink-2); }
dl.facts dd { margin: 2px 0 0; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.stat .num { font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1; }
.split { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; }
.split > .main-col { flex: 999 1 560px; min-width: 0; }
.split > .side-col { flex: 1 1 320px; min-width: 0; position: sticky; top: 24px; }
.table-box { overflow-x: auto; }
table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--ink-2); font-size: 13px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
td { padding: 6px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.selected { background: var(--bg); }
.linkish { min-height: 44px; padding: 0; border: none; background: transparent; text-align: left; cursor: pointer; }
input[type=text], input[type=search] { width: 100%; min-height: 52px; padding: 0 16px; border-radius: 26px; border: 1.5px solid var(--line); background: var(--surface); }
ol.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
ol.steps li { display: flex; gap: 12px; align-items: flex-start; }
.step-n { flex: none; width: 30px; height: 30px; border-radius: 15px; background: var(--ink); color: #FFF; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.progress { height: 8px; border-radius: 4px; background: var(--neutral); overflow: hidden; }
.progress > div { height: 100%; background: var(--orange); }
.actions3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.actions3 .btn { padding: 0 8px; gap: 6px; }
dialog { border: none; border-radius: 24px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(22, 32, 26, .45); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: no-preference) { .progress > div { transition: width .3s ease; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Menú">
    <span class="wordmark">mochila<span>.</span></span>
    <nav aria-label="Secciones" id="side-nav"></nav>
    <div class="foot" id="side-foot"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Secciones" id="bottom-nav"></nav>
</div>
<dialog id="sheet" aria-label="Ficha de la skill"></dialog>
<script type="application/json" id="data">__BACKPACK_DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const SK = new Map(D.skills.map(s => [s.id, s]));
const PL = new Map(D.plugins.map(p => [p.id, p]));
const RC = new Map(D.recipes.map(r => [r.id, r]));
const fmt = n => Number(n).toLocaleString("es-CL");

// --- storage: per-viewer marks; the page must work when it is unavailable
const store = {
  get(k, d) { try { const v = localStorage.getItem("backpack." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("backpack." + k, JSON.stringify(v)); } catch (e) { /* private window */ } },
};
let marks = store.get("marks", {});           // key -> "remove" | "keep"; keys: skill id or "P:" + plugin id
let advanced = store.get("advanced", matchMedia("(min-width: 900px)").matches);
const saveMarks = () => store.set("marks", marks);

// --- DOM helpers: strings always become text nodes, never markup
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const ICONS = {
  bag: ["M6 10a6 6 0 0 1 12 0v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z", "M9.5 4.5V3h5v1.5", "M9 15h6"],
  book: ["M5 4h11a3 3 0 0 1 3 3v14H8a3 3 0 0 1-3-3z", "M5 18a3 3 0 0 1 3-3h11"],
  target: ["M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16", "M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6"],
  history: ["M3.5 12a8.5 8.5 0 1 0 2.5-6", "M3 4v5h5", "M12 8v4l3 2"],
  home: ["M4 11l8-7 8 7", "M6 10v10h12V10"],
  copy: ["M8 8h12v12H8z", "M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"],
  swap: ["M4 8h13l-3-3", "M20 16H7l3 3"],
  arrow: ["M5 12h14", "M13 6l6 6-6 6"],
  shield: ["M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"],
  clock: ["M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16", "M12 8v4l3 2"],
  weight: ["M7 7h10l3 13H4z", "M9 7a3 3 0 0 1 6 0"],
  x: ["M6 6l12 12", "M18 6L6 18"],
  check: ["M5 12.5l4.5 4.5L19 7.5"],
  chevron: ["M9 5l7 7-7 7"],
  eye: ["M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z", "M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6"],
};
function icon(name, size = 20, color = "currentColor") {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  for (const [k, v] of Object.entries({ width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color,
    "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) svg.setAttribute(k, v);
  for (const d of ICONS[name]) { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); svg.append(p); }
  return svg;
}
function backpackArt() {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("width", 84); svg.setAttribute("height", 98); svg.setAttribute("viewBox", "0 0 120 140"); svg.setAttribute("aria-hidden", "true");
  const parts = [
    ["path", { d: "M42 24V14a8 8 0 0 1 8-8h20a8 8 0 0 1 8 8v10", fill: "none", stroke: "#16201A", "stroke-width": 5, "stroke-linecap": "round" }],
    ["rect", { x: 12, y: 24, width: 96, height: 110, rx: 32, fill: "#F2581D", stroke: "#16201A", "stroke-width": 5 }],
    ["path", { d: "M14 60c28 14 64 14 92 0", fill: "none", stroke: "#16201A", "stroke-width": 4, "stroke-linecap": "round" }],
    ["rect", { x: 34, y: 82, width: 52, height: 34, rx: 10, fill: "#E9B425", stroke: "#16201A", "stroke-width": 4 }],
  ];
  for (const [tag, at] of parts) { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(at)) el.setAttribute(k, v); svg.append(el); }
  return svg;
}

// --- derived facts
const REC = { remove: "Quitar", review: "Revisar", merge: "Elegir una", tune: "Afinar", keep: "Conservar" };
const MOTIVES = [  // first matching reason code names the row
  ["security_high", "Seguridad", "orange"], ["exact_copy_extra", "Copia", "mustard"], ["unused", "Sin uso", "outline"],
  ["same_name_variants", "Repetida", "mustard"], ["competes", "Compite", ""], ["greedy", "Se cuela", "orange"],
  ["security_medium", "Seguridad", "mustard"], ["heavy_fixed", "Pesada", "outline"], ["heavy_body", "Pesada", "outline"],
  ["disabled", "Desactivada", ""], ["exact_copy_keeper", "Tiene copias", ""],
];
function motive(s) { for (const [code, label, cls] of MOTIVES) if (s.codes.includes(code)) return [label, cls]; return ["Bien", "green"]; }
function mainReason(s) { for (const [code] of MOTIVES) { const i = s.codes.indexOf(code); if (i >= 0) return i; } return 0; }
const removable = s => s.rec === "remove" && s.codes.includes("unused");
function plugOf(s) { return s.plugin ? PL.get(s.plugin) : null; }
function markKey(s) { return s.plugin ? "P:" + s.plugin : s.id; }
function markedRemoved(s) { return marks[markKey(s)] === "remove"; }
function currentLoad() { return D.skills.reduce((t, s) => t + (markedRemoved(s) ? 0 : s.fixed), 0); }
function lastUse(s) {
  const u = s.usage;
  if (!u) return "Sin datos aquí";
  if (!u.count) return "Sin uso registrado";
  return u.days_unused === 0 ? "Hoy" : `Hace ${fmt(u.days_unused)} días`;
}
const FILTERS = [
  ["pendientes", "Para revisar", s => s.rec !== "keep"],
  ["sin-uso", "Sin uso", s => s.codes.includes("unused") && s.rec === "remove"],
  ["copias", "Repetidas", s => s.codes.includes("exact_copy_extra") || s.codes.includes("same_name_variants")],
  ["compiten", "Compiten", s => s.codes.includes("competes")],
  ["se-cuelan", "Se cuelan", s => s.codes.includes("greedy")],
  ["pesadas", "Pesadas", s => s.codes.includes("heavy_fixed") || s.codes.includes("heavy_body")],
  ["seguridad", "Seguridad", s => s.codes.some(c => c.startsWith("security_"))],
  ["plugins", "Plugins", null],
  ["todas", "Todas", () => true],
];

// --- shell
const SECTIONS = [["inicio", "Inicio", "home"], ["revisar", "Revisar", "bag"], ["manual", "Manual", "book"], ["simulador", "Simulador", "target"], ["cambios", "Cambios", "history"]];
function navLinks(current, bottom) {
  return SECTIONS.map(([id, label, ic]) => h("a", { href: "#" + id, "aria-current": id === current ? "page" : null },
    bottom ? h("span", { class: "pill" }, icon(ic, 22)) : icon(ic, 20), label));
}
function modeToggle() {
  return h("button", { type: "button", class: "toggle", "aria-pressed": advanced, onclick: () => { advanced = !advanced; store.set("advanced", advanced); route(); } },
    h("span", { class: "switch" }), advanced ? "Modo avanzado" : "Modo simple");
}
function topbar() { return h("div", { class: "topbar" }, h("span", { class: "wordmark" }, "mochila", h("span", null, ".")), modeToggle()); }

// --- screens
function screenHome() {
  const t = D.totals, load = currentLoad();
  const pick = f => D.skills.filter(f);
  const unused = pick(s => s.codes.includes("unused") && s.rec === "remove");
  const copies = pick(s => s.codes.includes("exact_copy_extra"));
  const greedy = pick(s => s.codes.includes("greedy"));
  const heavy = pick(s => s.codes.includes("heavy_fixed"));
  const risky = pick(s => s.risk === "high");
  const sum = list => list.reduce((n, s) => n + s.fixed, 0);
  const row = (href, color, ic, title, sub, right, icColor = "#16201A") => h("a", { class: "row", href },
    h("span", { class: "dot", style: `background:${color}` }, icon(ic, 20, icColor)),
    h("span", { class: "grow" }, h("span", { class: "bold" }, title), h("span", { class: "small muted" }, sub)),
    right ? h("span", { class: "small bold" }, right) : icon("chevron", 18, "#4C5A51"));
  return [
    topbar(),
    h("h1", null, load > 10000 ? "Tu mochila pesa bastante." : "Tu mochila está liviana."),
    h("section", { class: "card", "aria-label": "Carga actual", style: "display:flex;align-items:center;gap:12px" },
      h("div", { class: "grow", style: "gap:6px" },
        h("span", { class: "small muted" }, "Claude carga esto en cada conversación"),
        h("span", { class: "big" }, fmt(load)),
        h("span", { class: "bold" }, `tokens · ${fmt(t.skills)} skills`),
        h("span", { class: "tiny muted" }, "Estimado. Pesa aunque nunca uses la skill.")),
      backpackArt()),
    t.savings ? h("p", { class: "note" }, `Si quitas lo sugerido, bajaría a ~${fmt(t.fixed_tokens_after_removals)} tokens (estimado).`) : null,
    h("h2", null, "Dónde está el peso"),
    h("div", { class: "stack" },
      unused.length ? row("#revisar/sin-uso", "#F2581D", "clock", `${fmt(unused.length)} skills sin uso`,
        t.usage_history_since ? `Ninguna se usó desde el ${t.usage_history_since}` : "No hay registro de uso", `~${fmt(sum(unused))} tk`) : null,
      copies.length ? row("#revisar/copias", "#E9B425", "copy", `${fmt(copies.length)} copias exactas`, "La misma skill, instalada dos veces", `~${fmt(sum(copies))} tk`) : null,
      D.competing.length ? row("#revisar/compiten", "#DCE3DC", "swap", `${fmt(D.competing.length)} pares que compiten`, "Hacen casi lo mismo con otro nombre") : null,
      greedy.length ? row("#revisar/se-cuelan", "#F2581D", "arrow", `${fmt(greedy.length)} skills que se cuelan`, "Piden ir antes que todas") : null,
      heavy.length ? row("#revisar/pesadas", "#DCE3DC", "weight", `${fmt(heavy.length)} con descripción pesada`, "Ocupan mucho en cada conversación", `~${fmt(sum(heavy))} tk`) : null,
      row("#revisar/seguridad", "#2E6B4E", "shield", "Seguridad",
        risky.length ? `${fmt(risky.length)} con algo serio para revisar` : "Nada serio en la revisión automática", null, "#FFFFFF")),
    h("a", { class: "btn primary wide", href: "#revisar" }, "Empezar la revisión", icon("arrow", 20)),
    h("p", { class: "tiny muted" }, D.disclaimer),
  ];
}

// review queue for simple mode: plugins are removed whole, loose skills one by one
function queue() {
  const items = [];
  for (const p of D.plugins) if (p.rec !== "keep") items.push({ kind: "plugin", id: p.id, rec: p.rec, fixed: p.fixed });
  for (const s of D.skills) if (!s.plugin && s.rec !== "keep") items.push({ kind: "skill", id: s.id, rec: s.rec, fixed: s.fixed });
  const order = { remove: 0, review: 1, merge: 2, tune: 3 };
  items.sort((a, b) => order[a.rec] - order[b.rec] || b.fixed - a.fixed || a.id.localeCompare(b.id));
  return items;
}
function screenReviewSimple() {
  const all = queue();
  const keyOf = it => it.kind === "plugin" ? "P:" + it.id : it.id;
  const pending = all.filter(it => !marks[keyOf(it)]);
  const done = all.length - pending.length;
  const head = [topbar(), h("h1", null, "Revisión"),
    h("div", { class: "progress", role: "progressbar", "aria-label": "Avance de la revisión", "aria-valuemin": 0, "aria-valuemax": all.length, "aria-valuenow": done },
      h("div", { style: `width:${all.length ? (100 * done / all.length) : 100}%` })),
    h("span", { class: "small muted" }, `${fmt(done)} de ${fmt(all.length)} revisadas`)];
  if (!pending.length) return [...head, h("div", { class: "card stack" }, h("h2", null, "¡Listo!"),
    h("p", null, "Revisaste todo lo sugerido. Mira el resumen en Cambios."), h("a", { class: "btn primary", href: "#cambios" }, "Ver cambios"))];
  const it = pending[0], key = keyOf(it), load = currentLoad();
  const decide = v => { marks[key] = v; saveMarks(); route(); };
  const body = it.kind === "plugin" ? pluginCard(PL.get(it.id)) : skillCard(SK.get(it.id));
  return [...head,
    h("div", { class: "card", style: "display:flex;justify-content:space-between;align-items:baseline;gap:8px" },
      h("span", { class: "small muted" }, "Carga si la quitas"),
      h("span", null, h("s", { class: "muted" }, fmt(load)), " ", h("span", { class: "bold" }, fmt(load - it.fixed)), " tokens")),
    h("article", { class: "card stack", style: "gap:14px" }, body),

  panel: "dashboard", tarea: "task todo", campa: "campaign", conte: "content", socia: "social", anima: "animation animate",

  const pending = remove.filter(x => !done[x.key]);
  const text = pending.length ? "Quiero quitar estas skills y plugins. Guíame paso a paso:\n" +
    pending.map(x => `- ${x.label} (${x.origin})${x.guide && x.guide.command ? `: ${x.guide.command}` : ""}${x.guide && x.guide.path ? `: ${x.guide.path}` : ""}`).join("\n") : "";
  const copy = h("button", { type: "button", class: "btn primary", onclick: () => copyText(text, copy) }, icon("copy", 18), "Copiar la lista para Claude");
  const list = items => h("div", { class: "stack" }, items.map(x => h("div", { class: "row" }, head(x),
    h("button", { type: "button", class: "chip", onclick: () => undo(x.key) }, "Deshacer"))));
  return [topbar(), h("h1", null, "Cambios"),
    h("p", { class: "note" }, "Nada se borra solo. Sigue los pasos de cada una y marca «Ya lo quité». Después vuelve a pedirle a Claude que revise tus skills para ver la mochila más liviana."),
    h("section", { class: "card stack", "aria-label": "Para quitar" }, h("h2", null, `Para quitar (${fmt(remove.length)})`),
      remove.length ? [h("p", { class: "bold" }, `Liberarías ~${fmt(freed)} tokens en cada conversación (estimado). Llevas ${fmt(remove.length - pending.length)} de ${fmt(remove.length)}.`),
        removeList, pending.length ? h("div", { class: "wrap" }, copy) : null]
        : h("p", { class: "muted" }, "Aún no marcaste nada para quitar.")),
    h("section", { class: "card stack", "aria-label": "Para conservar" }, h("h2", null, `Para conservar (${fmt(keep.length)})`),
      keep.length ? list(keep) : h("p", { class: "muted" }, "Aún no marcaste nada para conservar.")),
    Object.keys(marks).length ? h("button", { type: "button", class: "btn", onclick: () => { if (confirm("¿Borrar todas tus marcas?")) { marks = {}; done = {}; saveMarks(); store.set("done", done); route(); } } }, "Empezar de cero") : null];
}

function copyText(text, button) {
  const done = () => { const old = button.textContent; button.textContent = "Copiado"; setTimeout(() => { button.textContent = old; }, 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() {
    const area = h("textarea", { class: "sr" }); area.value = text; document.body.append(area); area.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* user can still select the text */ }
    area.remove();
  }
}

// --- router
function route() {
  const [name, arg] = (location.hash.slice(1) || "inicio").split("/");
  const current = SECTIONS.some(s => s[0] === name) ? name : "inicio";
  let view;
  if (current === "revisar") view = (advanced || arg) ? screenReviewTable(arg) : screenReviewSimple();
  else if (current === "manual") view = screenManual(arg);
  else if (current === "simulador") view = screenSimulator();
  else if (current === "cambios") view = screenChanges();
  else view = screenHome();
  document.getElementById("main").replaceChildren(...[view].flat(Infinity).filter(Boolean));
  document.getElementById("side-nav").replaceChildren(...navLinks(current, false));
  document.getElementById("bottom-nav").replaceChildren(...navLinks(current, true));
  document.getElementById("side-foot").replaceChildren(modeToggle(), h("span", null, "Cifras estimadas. Se cargan aunque nunca uses la skill."));
}
let lastRoute = "";
addEventListener("hashchange", () => { const r = location.hash.split("/")[0]; if (r !== lastRoute) { window.scrollTo(0, 0); lastRoute = r; } route(); });
sheet.addEventListener("close", () => sheet.replaceChildren());
route();
</script>
